[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "mlruns", "mlflow_store", "runs", "frontend/node_modules", "frontend/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
addopts = "-q"
