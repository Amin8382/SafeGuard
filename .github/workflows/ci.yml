name: SafeGuard CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall src backend scripts
      - run: ruff check src backend tests scripts
      - run: pytest backend/tests tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - working-directory: frontend
        run: npm install --no-audit --no-fund
      - working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python-quality, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend frontend
